<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault picker debug</title>
<link rel="stylesheet" href="/desk/desk.css">
<style>
  body{background:#111;color:#eee;font-family:sans-serif;padding:24px}
  #vault-root label.vdrop{display:block;border:2px dashed rgba(255,255,255,.22);border-radius:12px;padding:32px 16px;text-align:center;color:#9fb0c3;cursor:pointer;min-height:120px;position:relative;max-width:560px}
  #vault-root .vdrop strong{display:block;font-size:16px;color:#fff;margin-bottom:6px}
  #vault-root .vdrop input{position:absolute;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none}
  #vault-root .vfileline{margin-top:12px;font-size:14px;background:rgba(255,255,255,.06);border-radius:8px;padding:10px 12px;display:none;color:#e8eef4;max-width:560px}
  #dbg{margin-top:24px;background:#000;border:1px solid #333;border-radius:8px;padding:12px;max-width:560px;font-size:13px;line-height:1.7;white-space:pre-wrap}
</style>
</head>
<body>
<div id="vault-root">
  <label class="vdrop" id="vdropEnc">
    <strong>Drop your PDF here</strong>
    or tap here to choose a file
    <input type="file" id="vfileEnc" accept=".pdf,application/pdf">
  </label>
  <div class="vfileline" id="vfileEncLine"></div>
  <div id="dbg">debug log:
</div>
</div>
<script src="/desk/desk.js"></script>
<script>
"use strict";
function $(id){ return document.getElementById(id); }
function log(m){ $("dbg").textContent += m + "\n"; }
var drop = $("vdropEnc"), input = $("vfileEnc");
log("label tag: " + drop.tagName + ", input tag: " + input.tagName + ", input type: " + input.type);
drop.addEventListener("click", function(e){ log("label got click, target=" + e.target.tagName + "#" + (e.target.id||"")); });
input.addEventListener("click", function(e){ log("input got click"); });
input.addEventListener("change", function(){
  log("input change fired, files=" + input.files.length);
  var f = input.files[0];
  if(!f){ log("no file"); return; }
  var line = $("vfileEncLine");
  line.style.display = "block";
  line.textContent = "FILE: " + f.name + " (" + f.size + " bytes)";
  log("file line shown: " + f.name);
});
// hit-test: what is on top at the label center?
var r = drop.getBoundingClientRect();
var el = document.elementFromPoint(r.left + r.width/2, r.top + r.height/2);
log("elementFromPoint at label center: " + (el ? el.tagName + "#" + (el.id||"") : "null"));
var cs = getComputedStyle(input);
log("input css: position=" + cs.position + " opacity=" + cs.opacity + " pointerEvents=" + cs.pointerEvents + " width=" + cs.width + " height=" + cs.height);
</script>
</body>
</html>
