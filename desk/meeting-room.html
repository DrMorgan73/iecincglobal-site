<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Room — IEC Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/desk/desk.css">
</head>
<body data-page="meeting">
<div class="orbs" aria-hidden="true"><span class="orb gold"></span><span class="orb teal"></span><span class="orb violet"></span></div>

<div class="shell">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="logo">S</div>
      <div><h1>IEC <span>Suite</span></h1><p>International Empire Consultants, Inc.</p></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="themes" id="themes">
        <button data-t="midnight" style="--sw1:#f0b942;--sw2:#2dd4bf" title="Midnight Gold"></button>
        <button data-t="amethyst" style="--sw1:#d8b4fe;--sw2:#f0abfc" title="Royal Amethyst"></button>
        <button data-t="ocean" style="--sw1:#7dd3fc;--sw2:#5eead4" title="Deep Ocean"></button>
        <button data-t="ember" style="--sw1:#fdba74;--sw2:#fbbf24" title="Sunset Ember"></button>
        <button data-t="emerald" style="--sw1:#6ee7b7;--sw2:#f0b942" title="Emerald Noir"></button>
        <button data-t="rose" style="--sw1:#fda4af;--sw2:#f0abfc" title="Rose Noir"></button>
      </div>
      <button class="signout" id="signout"><i>🚪</i>Sign out</button>
      <a class="public-link" href="/welcome.html">← Public site</a>
      <div class="clockbox">
        <div id="clock">--:--</div>
        <div id="dateline">—</div>
      </div>
    </div>
  </aside>

  <main>
    <div class="section-head"><h2>Meeting Room</h2><span class="live"><i></i>reserved</span></div>
    <div class="card hero" style="margin-bottom:16px">
      <div>
        <h2 id="meeting-title">IEC Team Meeting</h2>
        <p id="meeting-sub">Today · 8:00 AM ET · IEC Suite</p>
      </div>
      <div class="countdown"><div id="countdown">--</div><div class="hint">until doors open</div></div>
    </div>
    <div class="section-head"><h2>Agenda</h2></div>
    <div class="feed" id="agenda"><div class="empty">Loading the agenda…</div></div>
    <div class="section-head"><h2>Around the table</h2><span class="hint" id="attendee-count"></span></div>
    <div class="grid offices" id="meeting-attendees"></div>

    <footer>© 2026 International Empire Consultants, Inc. · IEC Suite</footer>
  </main>
</div>

<script src="/desk/desk.js"></script>
<script>
function nextMeetingTime(){
  const n = new Date();
  const t = new Date(n);
  t.setHours(8, 0, 0, 0);
  return t;
}
function tickCountdown(){
  const el = $('countdown'); if(!el) return;
  const diff = nextMeetingTime() - new Date();
  if(diff <= 0){ el.textContent = 'LIVE'; return; }
  const h = Math.floor(diff / 3600000), m = Math.floor(diff % 3600000 / 60000), s = Math.floor(diff % 60000 / 1000);
  el.textContent = (h ? h + 'h ' : '') + String(m).padStart(2, '0') + 'm ' + String(s).padStart(2, '0') + 's';
}
setInterval(tickCountdown, 1000);

let OFFICES = [];
(async function(){
  try{
    const [meeting, agents] = await Promise.all([
      fetch('/desk/data/meeting.json').then(r => r.json()),
      fetch('/desk/data/agents.json').then(r => r.json())
    ]);
    $('meeting-title').textContent = meeting.title || 'IEC Team Meeting';
    $('meeting-sub').textContent = (meeting.date ? new Date(meeting.date + 'T12:00:00').toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'}) + ' · ' : '')
      + (meeting.time || '8:00 AM ET') + ' · ' + (meeting.location || 'IEC Suite');
    $('agenda').innerHTML = (meeting.agenda || []).map(a =>
      `<div class="feed-item"><div class="feed-time">${esc(a.t)}</div><div class="feed-body">${esc(a.body)}</div></div>`).join('')
      || '<div class="empty">No agenda items.</div>';
    const TEAM = agents.team || [], CREWS = agents.crews || [], DEPARTMENTS = agents.departments || [];
    const deptName = id => (DEPARTMENTS.find(x => x.id === id) || {}).name || '';
    OFFICES = [
      ...TEAM.map(m => ({...m, when: m.schedule, whenLabel: 'Runs'})),
      ...CREWS.map(m => ({...m, when: m.heartbeat, whenLabel: 'Heartbeat'}))
    ];
    OFFICES.forEach((m, i) => m._i = i);
    $('meeting-attendees').innerHTML = OFFICES.map(m => `
      <button class="card office tap" data-office="${m._i}">
        <span class="office-photo"><img src="${avatarFor(m.name)}" alt="${esc(m.name)}" loading="lazy"></span>
        <span class="office-plate">${esc(m.name)}</span>
        ${deptName(m.dept) ? `<div><span class="dept-tag">${esc(deptName(m.dept))}</span></div>` : ''}
        <p>${esc(m.role)}</p>
        <span class="open-hint">tap to visit →</span>
      </button>`).join('');
    $('attendee-count').textContent = OFFICES.length + ' summoned';
  }catch{
    $('agenda').innerHTML = '<div class="empty">Agenda not loaded.</div>';
  }
  tickCountdown();
})();

$('meeting-attendees').addEventListener('click', e => {
  const c = e.target.closest('[data-office]'); if(!c) return;
  const m = OFFICES[+c.dataset.office]; if(!m) return;
  openDrawer(`
    <img src="${avatarFor(m.name)}" alt="${esc(m.name)}" style="width:120px;height:120px;object-fit:cover;border-radius:50%;border:2px solid rgba(240,185,66,.5);margin-bottom:6px">
    <span class="tag gold">${esc(m.name)}'s office</span>
    <h2 style="margin:14px 0 8px;font-family:'Space Grotesk'">${esc(m.name)}</h2>
    <p style="color:var(--dim);font-size:14.5px">${esc(m.role)}</p>
    <div class="crew-hb" style="margin-top:14px">${esc(m.whenLabel)} · <b>${esc(m.when)}</b></div>`);
});
</script>
</body>
</html>
