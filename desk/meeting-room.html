<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Room — IEC Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/desk/desk.css">
</head>
<body data-page="meeting">
<div class="orbs" aria-hidden="true"><span class="orb gold"></span><span class="orb teal"></span><span class="orb violet"></span></div>

<div class="shell">
  <aside class="sidebar">
    <div class="side-brand">
      <img class="logo-img" src="/assets/iec-logo.png" alt="IEC Inc.">
      <div><h1>IEC <span>Suite</span></h1><p>International Empire Consultants, Inc.</p></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="themes" id="themes">
        <button data-t="iec" style="--sw1:#f0b942;--sw2:#3b82f6" title="IEC Brand"></button>
        <button data-t="midnight" style="--sw1:#f0b942;--sw2:#2dd4bf" title="Midnight Gold"></button>
        <button data-t="amethyst" style="--sw1:#d8b4fe;--sw2:#f0abfc" title="Royal Amethyst"></button>
        <button data-t="ocean" style="--sw1:#7dd3fc;--sw2:#5eead4" title="Deep Ocean"></button>
        <button data-t="ember" style="--sw1:#fdba74;--sw2:#fbbf24" title="Sunset Ember"></button>
        <button data-t="emerald" style="--sw1:#6ee7b7;--sw2:#f0b942" title="Emerald Noir"></button>
        <button data-t="rose" style="--sw1:#fda4af;--sw2:#f0abfc" title="Rose Noir"></button>
        <label class="cpick" title="Accent color"><input type="color" id="pick-gold" value="#f0b942"></label>
        <label class="cpick" title="Highlight color"><input type="color" id="pick-teal" value="#2dd4bf"></label>
        <button class="creset" id="pick-reset" title="Reset colors">⟲</button>
      </div>
      <button class="signout" id="signout"><i>🚪</i>Sign out</button>
      <a class="public-link" href="/welcome.html">← Public site</a>
      <div class="clockbox">
        <div id="clock">--:--</div>
        <div id="dateline">—</div>
      </div>
    </div>
  </aside>

  <main>
    <div class="section-head"><h2>Meeting Room</h2><span class="live"><i></i>reserved</span></div>

    <div class="boardroom">
      <div class="mode-row">
        <div class="mode-toggle" role="tablist" aria-label="Meeting size">
          <button data-mode="team" class="active" role="tab">Team meeting</button>
          <button data-mode="full" role="tab">Call full team meeting</button>
        </div>
        <span class="hint" id="attendee-count"></span>
      </div>

      <div class="media-wall" aria-label="Media wall">
        <div class="mscreen">
          <h4>Agenda</h4>
          <ul id="wall-agenda"><li class="dim">Loading…</li></ul>
        </div>
        <div class="mscreen main">
          <span class="live-dot" id="wall-live" hidden></span>
          <h3 id="wall-title">IEC Team Meeting</h3>
          <p id="wall-sub">Today · 8:00 AM ET</p>
          <div class="wall-count" id="wall-countdown">--</div>
          <div class="wall-cap">until doors open</div>
        </div>
        <div class="mscreen">
          <h4>Around the table</h4>
          <ul id="wall-attendees"><li class="dim">Loading…</li></ul>
        </div>
      </div>

      <div class="table-scene" id="table-scene" aria-label="IEC boardroom — live meeting"></div>
      <p class="hint" style="margin-top:10px"><span class="live"><i></i></span> Live from the IEC boardroom.</p>
    </div>

    <footer>© 2026 International Empire Consultants, Inc. · IEC Suite</footer>
  </main>
</div>

<script src="/desk/desk.js"></script>
<script>
const SEAT_COLORS = ['#f0b942','#2dd4bf','#a78bfa','#f472b6','#60a5fa','#34d399','#fb923c','#facc15'];
function seatColor(name){ let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return SEAT_COLORS[h % SEAT_COLORS.length]; }
function initials(name){ return String(name).split(/[\s.]+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase(); }

let TEAM = [], CREWS = [], MEETING = null, MODE = 'team';

function nextMeetingTime(){
  const n = new Date();
  const t = new Date(n);
  t.setHours(8, 0, 0, 0);
  return t;
}
function tickCountdown(){
  const el = $('wall-countdown'); if(!el) return;
  const diff = nextMeetingTime() - new Date();
  const live = $('wall-live');
  if(diff <= 0){ el.textContent = 'LIVE'; if(live) live.hidden = false; return; }
  const h = Math.floor(diff / 3600000), m = Math.floor(diff % 3600000 / 60000), s = Math.floor(diff % 60000 / 1000);
  el.textContent = (h ? h + 'h ' : '') + String(m).padStart(2, '0') + 'm ' + String(s).padStart(2, '0') + 's';
}

function renderWall(){
  if(MEETING){
    $('wall-title').textContent = MEETING.title || 'IEC Team Meeting';
    $('wall-sub').textContent = (MEETING.date ? new Date(MEETING.date + 'T12:00:00').toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'}) + ' · ' : '')
      + (MEETING.time || '8:00 AM ET') + ' · ' + (MEETING.location || 'IEC Suite');
    $('wall-agenda').innerHTML = (MEETING.agenda || []).map(a =>
      `<li><b>${esc(a.t)}</b><span>${esc(a.body)}</span></li>`).join('') || '<li class="dim">No agenda items.</li>';
  }
}

function seated(){
  const members = MODE === 'full' ? [...TEAM, ...CREWS] : TEAM;
  return [{ name: 'DrMorgan', role: 'President & CEO — chairs the meeting', boss: true },
    ...members.map(m => ({ name: m.name, role: m.role, dept: m.dept }))];
}

function renderBoardroom(){
  const seats = seated();
  const n = seats.length;
  $('attendee-count').textContent = n + ' in the room';
  $('wall-attendees').innerHTML = seats.map(s =>
    `<li><i style="background:${seatColor(s.name)}"></i><span>${esc(s.name)}</span></li>`).join('');
}

document.querySelectorAll('.mode-toggle button').forEach(b =>
  b.addEventListener('click', () => {
    document.querySelectorAll('.mode-toggle button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    MODE = b.dataset.mode;
    renderBoardroom();
  }));

(async function(){
  try{
    const [meeting, agents] = await Promise.all([
      fetch('/desk/data/meeting.json').then(r => r.json()),
      fetch('/desk/data/agents.json').then(r => r.json())
    ]);
    MEETING = meeting;
    TEAM = agents.team || [];
    CREWS = agents.crews || [];
    renderWall();
    renderBoardroom();
  }catch{
    $('wall-agenda').innerHTML = '<li class="dim">Agenda not loaded.</li>';
  }
  tickCountdown();
  setInterval(tickCountdown, 1000);
})();
</script>
</body>
</html>
