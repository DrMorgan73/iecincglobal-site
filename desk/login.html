<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Morgan Desk · IEC, Inc.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a12;--gold:#f0b942;--gold-deep:#c98f1f;--teal:#2dd4bf;--text:#eef1f7;--dim:#9aa3b8;--line:rgba(255,255,255,.09);--red:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;
  display:grid;place-items:center;padding:24px;line-height:1.55;-webkit-font-smoothing:antialiased}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.5}
.orb.gold{width:560px;height:560px;left:-160px;top:-160px;background:radial-gradient(circle,rgba(240,185,66,.34),transparent 65%)}
.orb.teal{width:520px;height:520px;right:-140px;top:32%;background:radial-gradient(circle,rgba(45,212,191,.22),transparent 65%)}
.card{width:min(420px,100%);background:rgba(255,255,255,.032);border:1px solid var(--line);border-radius:20px;
  padding:38px 36px;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;
  font-size:26px;color:#0a0d14;flex:none;background:linear-gradient(135deg,#ffe9b0,var(--gold) 45%,var(--gold-deep));
  box-shadow:0 6px 24px rgba(240,185,66,.35)}
.brand h1{font-family:'Space Grotesk';font-size:21px}
.brand h1 span{background:linear-gradient(120deg,var(--gold),#ffe9b0);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{font-size:11.5px;color:var(--dim);letter-spacing:.04em}
h2{font-family:'Space Grotesk';font-size:19px;margin-bottom:4px}
.sub{font-size:13.5px;color:var(--dim);margin-bottom:24px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--dim);letter-spacing:.03em;margin-bottom:14px}
input{width:100%;margin-top:6px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:11px;
  color:var(--text);font:500 15px 'Inter';padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,185,66,.15)}
button{width:100%;border:none;cursor:pointer;font:600 15px 'Space Grotesk';color:#0a0d14;padding:13px;
  border-radius:12px;background:linear-gradient(135deg,#ffe9b0,var(--gold) 55%,var(--gold-deep));
  box-shadow:0 8px 26px rgba(240,185,66,.3);transition:transform .2s,box-shadow .2s;margin-top:6px}
button:hover{transform:translateY(-2px)}
button:disabled{opacity:.6;cursor:wait;transform:none}
.err{display:none;margin-top:16px;font-size:13.5px;color:var(--red);background:rgba(248,113,113,.08);
  border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:10px 14px}
.err.show{display:block}
.foot{margin-top:26px;text-align:center;font-size:12px;color:var(--dim)}
.foot a{color:var(--dim);text-decoration:none}
.foot a:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><span class="orb gold"></span><span class="orb teal"></span></div>
<div class="card">
  <div class="brand">
    <div class="logo">M</div>
    <div><h1>Morgan <span>Desk</span></h1><p>International Empire Consultants, Inc.</p></div>
  </div>
  <h2>Private sign-in</h2>
  <p class="sub">This desk is for the IEC team only.</p>
  <form id="login" autocomplete="on">
    <label>Username<input id="u" name="username" autocomplete="username" required maxlength="64"></label>
    <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" id="go">Sign in →</button>
  </form>
  <div class="err" id="err">That didn't match. Check your username and password and try again.</div>
  <div class="foot"><a href="/welcome.html">← IEC public site</a></div>
</div>
<script>
const f = document.getElementById('login'), err = document.getElementById('err'), go = document.getElementById('go');
f.addEventListener('submit', async e => {
  e.preventDefault();
  err.classList.remove('show'); go.disabled = true; go.textContent = 'Signing in…';
  try{
    const r = await fetch('/api/desk-login', {
      method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({ username: document.getElementById('u').value.trim(), password: document.getElementById('p').value })
    });
    if(r.ok){ location.href = '/'; return; }
    err.classList.add('show');
  }catch{ err.classList.add('show'); }
  go.disabled = false; go.textContent = 'Sign in →';
});
</script>
</body>
</html>
