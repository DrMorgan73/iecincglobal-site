<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign and join the IEC Partner Portal — IEC, Inc.</title>
<meta name="description" content="Sign IEC's confidentiality agreement (CNDA) and Contractor Referral Agreement, and your IEC Partner Portal account is created — your activation link is emailed to you.">
<link rel="icon" href="/assets/iec-logo.png">
<link rel="stylesheet" href="/partners/app.css">
<style>
  .pp-doc{border:1px solid #DCE3EC;border-radius:14px;background:#fff;padding:28px 30px;max-height:560px;overflow:auto;box-shadow:0 8px 30px rgba(14,42,71,.06)}
  .pp-doc h2{font-size:19px;margin:22px 0 8px;color:#0E2A47}
  .pp-doc h2:first-child{margin-top:0}
  .pp-doc p{white-space:pre-wrap;color:#26313F;margin:0 0 10px;line-height:1.65}
  .pp-sigform{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .pp-sigform .full{grid-column:1/-1}
  @media (max-width:720px){.pp-sigform{grid-template-columns:1fr}}
  .pp-agree{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:#26313F}
  .pp-agree input{width:auto;margin-top:3px;min-height:0}
</style>
</head>
<body>
<div id="pp-root">
  <div class="pp-qwrap">
    <div class="pp-front-hero">
      <img class="pp-front-logo" src="/assets/iec-logo.png" alt="IEC, Inc.">
      <div class="pp-front-k">IEC, Inc. · Partner Portal</div>
      <h1 class="pp-front-h">Sign and join the IEC Partner Portal</h1>
      <p class="pp-front-p">Loading…</p>
    </div>
  </div>
</div>
<noscript><p style="text-align:center;padding:2rem">This page needs JavaScript. Questions? info@iecincglobal.com</p></noscript>
<script>window.PARTNER_PORTAL_LANG = 'en';</script>
<script src="/partners/sign.js" defer></script>
</body>
</html>
